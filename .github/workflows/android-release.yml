name: Android release APKs

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional signing: if repo secrets KEYSTORE_BASE64 (+ passwords) exist,
      # materialize them into local.properties. Absent → unsigned release APKs.
      - name: Configure signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } >> local.properties
            echo "Release keystore configured."
          else
            echo "No KEYSTORE_BASE64 secret: building UNSIGNED release APKs."
          fi

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Assemble TV release APK
        run: ./gradlew :app-tv:assembleRelease

      - name: Collect APKs with version
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist
          # Signed builds emit app-tv-release.apk; unsigned builds app-tv-release-unsigned.apk.
          apk=$(find app-tv/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "No release APK found in app-tv/build/outputs/apk/release"
            find app-tv/build/outputs -name '*.apk' || true
            exit 1
          fi
          cp "$apk" "dist/idlix-tv-${TAG}.apk"
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - name: Create release with APKs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
