name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Assemble + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble core:data
        run: ./gradlew :core:data:assembleDebug --stacktrace

      - name: Assemble app-tv
        run: ./gradlew :app-tv:assembleDebug --stacktrace

      - name: Assemble app-mobile
        run: ./gradlew :app-mobile:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :core:data:testDebugUnitTest :app-tv:testDebugUnitTest :app-mobile:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            core/data/build/reports/tests/
            app-tv/build/reports/tests/
            app-mobile/build/reports/tests/
